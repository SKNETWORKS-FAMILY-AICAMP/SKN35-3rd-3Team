[theme]
base = "light"
primaryColor = "#4C5DE8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FF"
textColor = "#17213C"
borderColor = "#E5E9F3"
baseRadius = "large"
buttonRadius = "12px"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#F8FAFF"
secondaryBackgroundColor = "#EDF1FF"
