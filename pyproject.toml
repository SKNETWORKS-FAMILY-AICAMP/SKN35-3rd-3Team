[project]
name = "skn35-3rd-3team"
version = "0.1.0"
description = "Add your description here"
readme = "README_jb.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "numpy>=2.5.3",
    "openai>=2.7.0",
    "python-dotenv>=1.1.1",
    "qdrant-client[fastembed]>=1.15.1,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
